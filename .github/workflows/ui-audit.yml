name: UI audit

# Enforces docs/ui/standards.md with cheap (grep-only) ratcheting/strict checks:
#  - ui-audit.sh: fails on NEW raw fontSize/Color(0x..)/AlertDialog/menu-ListItem/blur and any new
#    legacy download read in ui/ (R13), beyond scripts/ui-audit-baseline.tsv.
#  - check-download-unification.sh: whole-app guard that download/progress state stays on the one
#    path (no legacy DownloadUtil.downloads/getDownload reads, no Download.STATE_* outside the
#    download infra, no per-surface Icon.Download). See docs/ui/standards.md §12.
#  - check-dead-resources.sh: dead-resource ratchet — every string/drawable/raw resource must be
#    referenced; known-dead strings.xml entries are grandfathered in
#    scripts/dead-resources-baseline.txt (shrink-only).
# Runs on every push/PR to main. check-download-unification.sh and check-dead-resources.sh
# scan the whole app (utils/, viewmodels/, db/, MusicService, all modules), so a banned
# pattern introduced outside ui/ or playback/ must still be caught. The checks are grep-only
# (seconds, no JDK), so running them unconditionally is cheap.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  ui-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: UI standards audit (ratcheting)
        run: bash scripts/ui-audit.sh

      - name: Download unification guard
        run: bash scripts/check-download-unification.sh

      - name: Dead-resource ratchet
        run: bash scripts/check-dead-resources.sh
