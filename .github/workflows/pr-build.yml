name: PR Debug Build

on:
  pull_request:
    branches: [ main ]

env:
  # Disable LTO for faster CI builds
  DISABLE_LTO: true

jobs:
  build-debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache NDK/CMake outputs
        uses: actions/cache@v4
        with:
          path: |
            app/.cxx
            ~/.cmake
          key: ndk-debug-${{ runner.os }}-${{ hashFiles('app/src/main/cpp/**') }}
          restore-keys: ndk-debug-${{ runner.os }}-

      - name: Configure Android SDK path
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Configure Firebase
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > app/google-services.json

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Assemble debug build
        run: ./gradlew --no-daemon --parallel --build-cache assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
